<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">ScarX developer profile terminal</title>
  <desc id="desc">A terminal-inspired developer profile card for ScarX.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d14"/>
      <stop offset="1" stop-color="#101522"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="12%" r="85%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#8b5cf6" stop-opacity=".04"/>
      <stop offset="1" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
      .muted { fill: #64748b; }
      .text { fill: #cbd5e1; }
      .bright { fill: #f1f5f9; }
      .teal { fill: #2dd4bf; }
      .violet { fill: #a78bfa; }
      .amber { fill: #fbbf24; }
      .pink { fill: #fb7185; }
      .label { fill: #f59e0b; font-weight: 600; }
      .rule { stroke: #334155; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="18" fill="#05070b"/>
  <rect x="15" y="15" width="1170" height="620" rx="13" fill="url(#background)" stroke="#20283a" filter="url(#shadow)"/>
  <rect x="15" y="15" width="1170" height="620" rx="13" fill="url(#glow)"/>

  <circle cx="45" cy="45" r="6" fill="#fb7185"/>
  <circle cx="66" cy="45" r="6" fill="#fbbf24"/>
  <circle cx="87" cy="45" r="6" fill="#34d399"/>
  <text x="600" y="51" text-anchor="middle" class="mono muted" font-size="14">ashiqtasdid@github — profile</text>
